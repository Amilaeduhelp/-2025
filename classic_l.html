<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>සම්භාව්‍ය සාහිත්‍ය පරිශීලකය</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Sinhala:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Serif Sinhala', serif;
            background: #EBF9DE;
            min-height: 100vh;
        }
        
        .container {
            max-width: 7xl;
            margin: 0 auto;
            padding: 1.5rem;
        }
        
        .header {
            text-align: center;
            margin-bottom: 2rem;
            padding-top: 1.5rem;
        }
        
        .header-title {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.75rem;
        }
        
        .header h1 {
            font-size: 3rem;
            font-weight: bold;
            color: #827717;
        }
        
        .header p {
            color: #827717;
            font-size: 1.125rem;
            opacity: 0.9;
            font-weight: 600;
        }
        
        .tabs {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        
        .tab {
            flex: 1;
            min-width: 200px;
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(130, 119, 23, 0.4);
            border-radius: 1rem 1rem 0 0;
            color: #827717;
            font-weight: bold;
            text-align: center;
            font-size: 1.125rem;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: block;
        }
        
        .tab:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        
        .tab.active {
            background: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-bottom: 4px solid #AFB42B;
        }
        
        .main-content {
            background: white;
            border-radius: 0 0 1rem 1rem;
            border-radius: 0 1rem 1rem 1rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }
        
        .controls {
            background: #B7E28F;
            padding: 2rem;
        }
        
        .controls h2 {
            font-size: 1.875rem;
            font-weight: bold;
            color: #827717;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        
        .control-group {
            margin-bottom: 1.5rem;
            max-width: 48rem;
            margin-left: auto;
            margin-right: auto;
        }
        
        .control-group:last-child {
            margin-bottom: 0;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #827717;
        }
        
        .control-group select,
        .control-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #827717;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-family: inherit;
            background: white;
            transition: all 0.3s;
        }
        
        .control-group input {
            cursor: text;
        }
        
        .control-group select:hover,
        .control-group input:hover {
            border-color: #AFB42B;
        }
        
        .control-group select:focus,
        .control-group input:focus {
            outline: none;
            border-color: #AFB42B;
            box-shadow: 0 0 0 3px rgba(175, 180, 43, 0.2);
        }
        
        .content-wrapper {
            padding: 2.5rem;
            line-height: 2.2;
            font-size: 1.125rem;
            color: #212529;
            min-height: 400px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .content-wrapper.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6c757d;
            font-style: italic;
        }
        
        .word {
            color: #AFB42B;
            cursor: pointer;
            transition: all 0.2s;
            padding: 2px 0;
            text-decoration: underline;
            text-decoration-style: dotted;
        }
        
        .word:hover {
            background: #F9FBE7;
            color: #827717;
            border-radius: 3px;
            text-decoration: solid;
        }
        
        .popup {
            display: none;
            position: fixed;
            background: white;
            border: 3px solid #AFB42B;
            border-radius: 0.75rem;
            padding: 1rem 1.25rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            max-width: 400px;
            animation: popupFade 0.2s ease-in;
        }
        
        @keyframes popupFade {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .popup-word {
            font-weight: bold;
            color: #827717;
            margin-bottom: 0.5rem;
            font-size: 1.1em;
        }
        
        .popup-meaning {
            color: #495057;
            line-height: 1.6;
        }
        
        .loading,
        .error {
            text-align: center;
            padding: 1.25rem;
            color: #6c757d;
        }
        
        .error {
            color: #dc3545;
        }
        
        .footer {
            text-align: center;
            padding: 1.5rem;
            background: #f8f9fa;
            border-top: 1px solid #dee2e6;
        }
        
        .footer p {
            color: #6c757d;
            font-size: 0.875rem;
        }
        
        .footer p:last-child {
            color: #adb5bd;
            font-size: 0.75rem;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-title">
                <h1>සිංහල ශබ්දකෝෂය</h1>
            </div>
            <p>සිංහල භාෂාවේ අලංකාර යෙදුම් එකතුව</p>
        </div>
        
        <div class="tabs">
    <a href="https://amilaeduhelp.github.io/dictionary/helabasa.html" class="tab">විසිතුරු හෙළ යෙදුම්</a>
    <a href="https://amilaeduhelp.github.io/dictionary/" class="tab">සිංහල ශබ්දකෝෂය</a>
    <div class="tab active">සාහිත කෙත</div>
</div>
        
        <div class="main-content">
            <div class="controls">
                <h2>📚 සම්භාව්‍ය සාහිත්‍ය පරිශීලකය</h2>
                
                <div class="control-group">
                    <label for="searchInput">පොතේ නමින් සොයන්න:</label>
                    <input type="text" id="searchInput" list="bookSuggestions" placeholder="පොතේ නම ටයිප් කරන්න...">
                    <datalist id="bookSuggestions"></datalist>
                </div>
                
                <div class="control-group">
                    <label for="typeSelect">වර්ගය:</label>
                    <select id="typeSelect">
                        <option value="">සියල්ල</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label for="bookSelect">පොත තෝරන්න:</label>
                    <select id="bookSelect">
                        <option value="">පොතක් තෝරන්න...</option>
                    </select>
                </div>
            </div>
            
            <div class="content-wrapper empty" id="content">
                පොතක් තෝරන්න...
            </div>
            
            <div class="footer">
                <p>Copyright © Amila Udawattha</p>
                <p>සියලු විශේෂාංග සහිතව - සාහිත කෙත v1.0</p>
            </div>
        </div>
    </div>
    
    <div class="popup" id="popup">
        <div class="popup-word" id="popupWord"></div>
        <div class="popup-meaning" id="popupMeaning"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://uqgzlaxsnknheoerbfus.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVxZ3psYXhzbmtuaGVvZXJiZnVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5MjM2MTUsImV4cCI6MjA3OTI4MzYxNX0.IYWZ7ukx8J-GJMWy7cMk2BWnmzJmJjjE93yEmJie7nQ';
        
        let wordsDictionary = {};
        let allBooks = [];
        let currentFilter = {
            search: '',
            type: ''
        };
        
        async function fetchData(table, select = '*') {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/${table}?select=${select}`, {
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`
                }
            });
            return await response.json();
        }
        
        async function loadBooks() {
            try {
                const books = await fetchData('classic_l', 'book,content,type');
                allBooks = books;
                
                const types = [...new Set(books.map(b => b.type).filter(t => t))];
                const typeSelect = document.getElementById('typeSelect');
                types.sort().forEach(type => {
                    const option = document.createElement('option');
                    option.value = type;
                    option.textContent = type;
                    typeSelect.appendChild(option);
                });
                
                displayFilteredBooks();
            } catch (error) {
                document.getElementById('content').innerHTML = '<div class="error">පොත් ලොඩ් කිරීමේ දී දෝෂයක් ඇතිවිය</div>';
            }
        }
        
        function displayFilteredBooks() {
            const bookSelect = document.getElementById('bookSelect');
            bookSelect.innerHTML = '<option value="">පොතක් තෝරන්න...</option>';
            
            let filtered = allBooks;
            
            if (currentFilter.type) {
                filtered = filtered.filter(book => book.type === currentFilter.type);
            }
            
            if (currentFilter.search) {
                filtered = filtered.filter(book => 
                    book.book && book.book.toLowerCase().includes(currentFilter.search.toLowerCase())
                );
            }
            
            filtered.forEach(book => {
                const option = document.createElement('option');
                option.value = book.content;
                option.textContent = book.book;
                option.dataset.type = book.type || '';
                bookSelect.appendChild(option);
            });
            
            if (filtered.length === 0) {
                const option = document.createElement('option');
                option.value = '';
                option.textContent = 'ප්‍රතිඵල හමු නොවුණි';
                option.disabled = true;
                bookSelect.appendChild(option);
            }
        }
        
        function updateSuggestions() {
            const datalist = document.getElementById('bookSuggestions');
            datalist.innerHTML = '';
            
            let filtered = allBooks;
            
            if (currentFilter.type) {
                filtered = filtered.filter(book => book.type === currentFilter.type);
            }
            
            if (currentFilter.search) {
                filtered = filtered.filter(book => 
                    book.book && book.book.toLowerCase().includes(currentFilter.search.toLowerCase())
                );
            }
            
            filtered.forEach(book => {
                const option = document.createElement('option');
                option.value = book.book;
                datalist.appendChild(option);
            });
        }
        
        async function loadDictionary() {
            try {
                const words = await fetchData('sinhala_words', 'word,meaning,different');
                words.forEach(item => {
                    if (item.word && item.word.trim()) {
                        wordsDictionary[item.word.trim()] = {
                            meaning: item.meaning || '',
                            originalWord: item.word.trim(),
                            isDifferent: false
                        };
                    }
                    if (item.different && item.different.trim()) {
                        const differentForms = item.different.split('/');
                        differentForms.forEach(form => {
                            const trimmedForm = form.trim();
                            if (trimmedForm) {
                                wordsDictionary[trimmedForm] = {
                                    meaning: item.meaning || '',
                                    originalWord: item.word ? item.word.trim() : '',
                                    isDifferent: true
                                };
                            }
                        });
                    }
                });
            } catch (error) {
                console.error('Dictionary loading error:', error);
            }
        }
        
        function processText(text) {
            const words = text.split(/(\s+)/);
            let processedHTML = '';
            
            words.forEach(segment => {
                if (segment.trim() === '') {
                    processedHTML += segment;
                } else {
                    const cleanWord = segment.trim();
                    const wordData = wordsDictionary[cleanWord];
                    if (wordData && wordData.meaning) {
                        processedHTML += `<span class="word" data-word="${cleanWord}">${segment}</span>`;
                    } else {
                        processedHTML += segment;
                    }
                }
            });
            
            return processedHTML;
        }
        
        document.getElementById('bookSelect').addEventListener('change', function() {
            const content = this.value;
            const contentDiv = document.getElementById('content');
            
            if (content) {
                contentDiv.classList.remove('empty');
                contentDiv.innerHTML = processText(content);
            } else {
                contentDiv.classList.add('empty');
                contentDiv.textContent = 'පොතක් තෝරන්න...';
            }
        });
        
        document.getElementById('searchInput').addEventListener('input', function() {
            currentFilter.search = this.value;
            updateSuggestions();
            displayFilteredBooks();
        });
        
        document.getElementById('typeSelect').addEventListener('change', function() {
            currentFilter.type = this.value;
            displayFilteredBooks();
        });
        
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('word')) {
                const word = e.target.dataset.word;
                const wordData = wordsDictionary[word];
                
                if (wordData) {
                    const popup = document.getElementById('popup');
                    const popupWord = document.getElementById('popupWord');
                    const popupMeaning = document.getElementById('popupMeaning');
                    
                    if (wordData.isDifferent) {
                        popupWord.textContent = `ඔබ සොයන වචනය '${word}'`;
                        popupMeaning.textContent = `ශබ්දකෝෂයේ '${wordData.originalWord}' යන වචනය තිබේ. එහි අරුත පහත පරිදි වේ. ගැළපේ ද බලන්න.\n\n${wordData.meaning}`;
                    } else {
                        popupWord.textContent = word;
                        popupMeaning.textContent = wordData.meaning;
                    }
                    
                    const rect = e.target.getBoundingClientRect();
                    popup.style.left = rect.left + 'px';
                    popup.style.top = (rect.bottom + 5) + 'px';
                    popup.style.display = 'block';
                }
            } else {
                document.getElementById('popup').style.display = 'none';
            }
        });
        
        (async function init() {
            await loadDictionary();
            await loadBooks();
        })();
    </script>
</body>
</html>
