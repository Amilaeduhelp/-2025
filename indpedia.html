<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>සිංහල Smart Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SUPABASE_URL = 'https://uqgzlaxsnknheoerbfus.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVxZ3psYXhzbmtuaGVvZXJiZnVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQ4MDQzMTEsImV4cCI6MjA2MDM4MDMxMX0.O5dNUizqZ5kfwTs0mHLEorqOAqjZFjWakp2Q484MKEk';

        // Icons
        const SearchIcon = () => (
            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
        );

        const BookIcon = () => (
            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
            </svg>
        );

        const ChevronDownIcon = () => (
            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" />
            </svg>
        );

        const LoaderIcon = () => (
            <svg className="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        );

        const CloseIcon = () => (
            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
            </svg>
        );

        // HTML <br> tags ඉවත් කර නිවැරදි line breaks දෙන function
        const formatContent = (text) => {
            if (!text) return '';
            return text.replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]*>/g, '');
        };

        // Popup Modal Component
        function ContentModal({ item, type, onClose, searchWord, onNavigate }) {
            const contentRef = useRef(null);
            const [relatedArticles, setRelatedArticles] = useState([]);
            const [loadingRelated, setLoadingRelated] = useState(false);

            useEffect(() => {
                document.body.style.overflow = 'hidden';
                return () => {
                    document.body.style.overflow = 'unset';
                };
            }, []);

            // Modal content වෙනස් වූ විට top එකට scroll කරන්න
            useEffect(() => {
                if (contentRef.current) {
                    contentRef.current.scrollTop = 0;
                }
            }, [item.id]); // item එක වෙනස් වූ විට trigger වේ

            // අතිරේක කියවීම් සොයන function
            useEffect(() => {
                const fetchRelatedArticles = async () => {
                    // learnX අර්ථදීපනී සඳහා පමණක් related articles සොයන්න
                    if (type !== 'learnX අර්ථදීපනී' || !searchWord) return;
                    
                    setLoadingRelated(true);
                    try {
                        // searchWord එකේ වචන වෙන් කරන්න (space වලින් split කරන්න)
                        const words = searchWord.split(/\s+/).filter(w => w.length > 2);
                        
                        if (words.length === 0) {
                            setLoadingRelated(false);
                            return;
                        }

                        // සෑම වචනයක්ම meaning column එකේ සොයන query එකක්
                        const searchTerms = words.map(w => `meaning.ilike.*${encodeURIComponent(w)}*`).join(',');
                        const url = `${SUPABASE_URL}/rest/v1/learnX pedia?select=id,word,meaning&or=(${searchTerms})&word=neq.${encodeURIComponent(searchWord)}&limit=6`;
                        
                        const response = await fetch(url, {
                            headers: {
                                'apikey': SUPABASE_ANON_KEY,
                                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                                'Content-Type': 'application/json'
                            }
                        });

                        if (response.ok) {
                            const data = await response.json();
                            setRelatedArticles(data);
                        }
                    } catch (err) {
                        console.error('Error fetching related articles:', err);
                    }
                    setLoadingRelated(false);
                };

                fetchRelatedArticles();
            }, [searchWord, type]);

            // වචනය highlight කරන්න
            const highlightText = (text) => {
                if (!searchWord || !text) return text;
                
                const regex = new RegExp(`(${searchWord})`, 'gi');
                const parts = text.split(regex);
                
                return parts.map((part, index) => {
                    if (part.toLowerCase() === searchWord.toLowerCase()) {
                        return <mark key={index} className="bg-yellow-300 px-1 rounded">{part}</mark>;
                    }
                    return part;
                });
            };

            // වචනය ඇති පළමු ස්ථානයට scroll කරන්න
            const scrollToWord = () => {
                if (!contentRef.current) return;
                
                const marks = contentRef.current.querySelectorAll('mark');
                if (marks.length > 0) {
                    marks[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
                    marks.forEach((mark, idx) => {
                        if (idx === 0) {
                            mark.classList.add('ring-2', 'ring-amber-500');
                        }
                    });
                }
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-2 sm:p-4" onClick={onClose}>
                    <div className="bg-white rounded-2xl shadow-2xl max-w-3xl w-full max-h-[95vh] sm:max-h-[90vh] overflow-hidden" onClick={(e) => e.stopPropagation()}>
                        {/* Header */}
                        <div className="bg-gradient-to-r from-amber-500 to-orange-500 p-4 sm:p-6 flex justify-between items-start">
                            <div className="flex-1 pr-2">
                                <h2 className="text-xl sm:text-2xl font-bold text-white mb-1 sm:mb-2 leading-tight">
                                    {type === 'ඉතිහාසය' && item.title}
                                    {type === 'පිළිතුරු' && item.question}
                                    {type === 'අධ්‍යාපන සබැඳි' && item.topic}
                                </h2>
                                <p className="text-amber-100 text-xs sm:text-sm">{type}</p>
                            </div>
                            <button 
                                onClick={onClose}
                                className="text-white hover:bg-white hover:bg-opacity-20 rounded-lg p-1.5 sm:p-2 transition-colors flex-shrink-0"
                            >
                                <CloseIcon />
                            </button>
                        </div>

                        {/* වචනය පෙන්වන්න Button */}
                        {searchWord && (type === 'ඉතිහාසය' || type === 'පිළිතුරු') && (
                            <div className="px-4 sm:px-6 pt-3 sm:pt-4">
                                <button
                                    onClick={scrollToWord}
                                    className="flex items-center gap-2 px-3 sm:px-4 py-2 bg-amber-100 hover:bg-amber-200 text-amber-900 rounded-lg font-semibold text-xs sm:text-sm transition-colors w-full sm:w-auto justify-center"
                                >
                                    <svg className="w-3 h-3 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                    </svg>
                                    <span className="truncate">"{searchWord}" වචනය ඇති තැන පෙන්වන්න</span>
                                </button>
                            </div>
                        )}

                        {/* Content */}
                        <div ref={contentRef} className="p-4 sm:p-6 overflow-y-auto max-h-[calc(95vh-200px)] sm:max-h-[calc(90vh-200px)]">
                            {type === 'learnX අර්ථදීපනී' && (
                                <div className="prose prose-sm sm:prose-lg max-w-none">
                                    <p className="text-gray-800 whitespace-pre-wrap leading-relaxed text-sm sm:text-base">
                                        {highlightText(item.meaning)}
                                    </p>

                                    {/* අතිරේක කියවීම් Section */}
                                    {relatedArticles.length > 0 && (
                                        <div className="mt-6 sm:mt-8 pt-6 border-t-2 border-amber-200">
                                            <h3 className="text-lg sm:text-xl font-bold text-amber-900 mb-4 flex items-center gap-2">
                                                <span>📖</span>
                                                <span>අතිරේක කියවීම්</span>
                                            </h3>
                                            <div className="grid grid-cols-1 gap-3">
                                                {relatedArticles.map((article) => (
                                                    <button
                                                        key={article.id}
                                                        onClick={() => onNavigate(article)}
                                                        className="text-left p-3 sm:p-4 bg-gradient-to-r from-amber-50 to-orange-50 hover:from-amber-100 hover:to-orange-100 rounded-lg border-2 border-amber-200 hover:border-amber-400 transition-all transform hover:scale-[1.02]"
                                                    >
                                                        <h4 className="font-bold text-amber-900 text-sm sm:text-base mb-1 flex items-center gap-2">
                                                            <span className="text-amber-600">→</span>
                                                            {article.word}
                                                        </h4>
                                                        <p className="text-gray-600 text-xs sm:text-sm line-clamp-2">
                                                            {article.meaning.substring(0, 100)}...
                                                        </p>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {loadingRelated && (
                                        <div className="mt-6 sm:mt-8 pt-6 border-t-2 border-amber-200 text-center">
                                            <div className="flex justify-center mb-2">
                                                <LoaderIcon />
                                            </div>
                                            <p className="text-amber-700 text-xs sm:text-sm">අතිරේක කියවීම් සොයමින්...</p>
                                        </div>
                                    )}
                                </div>
                            )}
                            {type === 'ඉතිහාසය' && (
                                <div className="prose prose-sm sm:prose-lg max-w-none">
                                    <p className="text-gray-800 whitespace-pre-wrap leading-relaxed text-sm sm:text-base">
                                        {highlightText(formatContent(item.content))}
                                    </p>
                                </div>
                            )}
                            {type === 'පිළිතුරු' && (
                                <div>
                                    <div className="mb-3 sm:mb-4 p-3 sm:p-4 bg-amber-50 rounded-lg">
                                        <h3 className="font-bold text-amber-900 mb-2 text-sm sm:text-base">ප්‍රශ්නය:</h3>
                                        <p className="text-gray-800 text-sm sm:text-base">{highlightText(item.question)}</p>
                                    </div>
                                    <div className="p-3 sm:p-4 bg-green-50 rounded-lg">
                                        <h3 className="font-bold text-green-900 mb-2 text-sm sm:text-base">පිළිතුර:</h3>
                                        <p className="text-gray-800 whitespace-pre-wrap leading-relaxed text-sm sm:text-base">
                                            {highlightText(formatContent(item.answer))}
                                        </p>
                                    </div>
                                </div>
                            )}
                            {type === 'අධ්‍යාපන සබැඳි' && (
                                <div>
                                    <div className="mb-3 sm:mb-4">
                                        <h3 className="font-bold text-gray-700 mb-2 text-sm sm:text-base">විෂයය:</h3>
                                        <p className="text-gray-800 text-base sm:text-lg">{item.subject}</p>
                                    </div>
                                    {item.link && (
                                        <a 
                                            href={item.link} 
                                            target="_blank" 
                                            rel="noopener noreferrer" 
                                            className="inline-block bg-blue-600 hover:bg-blue-700 text-white px-4 sm:px-6 py-2 sm:py-3 rounded-lg font-semibold transition-colors text-sm sm:text-base"
                                        >
                                            සබැඳිය විවෘත කරන්න →
                                        </a>
                                    )}
                                </div>
                            )}
                        </div>

                        {/* Footer */}
                        <div className="bg-gray-50 p-3 sm:p-4 border-t border-gray-200">
                            <button
                                onClick={onClose}
                                className="w-full bg-amber-500 hover:bg-amber-600 text-white py-2.5 sm:py-3 rounded-lg font-bold transition-colors text-sm sm:text-base"
                            >
                                හරි
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [searchTerm, setSearchTerm] = useState('');
            const [suggestions, setSuggestions] = useState([]);
            const [showSuggestions, setShowSuggestions] = useState(false);
            const [selectedWord, setSelectedWord] = useState(null);
            const [relatedContent, setRelatedContent] = useState([]);
            const [loadingRelated, setLoadingRelated] = useState(false);
            const [showRelated, setShowRelated] = useState(false);
            const [modalContent, setModalContent] = useState(null);
            const [navigationHistory, setNavigationHistory] = useState([]);
            const searchRef = useRef(null);

            // Search learnX pedia for suggestions
            const searchDictionary = async (term) => {
                if (term.length < 1) {
                    setSuggestions([]);
                    return;
                }

                try {
                    const encodedTerm = encodeURIComponent(term);
                    // වචනයේ ඕනෑම තැනක match වන පරිදි search කරන query
                    // *${term}* = වචනයේ මුල, මැද, අග ඕනෑම තැනක
                    // උදා: "පොෆ්" search කළහොත් "අන්ද්‍රපොෆ්", "යූරි ඇන්ඩ්‍රොපොව්" යනාදිය match වේ
                    const url = `${SUPABASE_URL}/rest/v1/learnX pedia?select=id,word,meaning&word=ilike.*${encodedTerm}*&limit=10&order=word.asc`;
                    
                    const response = await fetch(url, {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json',
                            'Prefer': 'return=representation'
                        }
                    });

                    if (response.ok) {
                        const data = await response.json();
                        setSuggestions(data);
                        setShowSuggestions(data.length > 0);
                    }
                } catch (err) {
                    console.error('Dictionary search error:', err);
                }
            };

            // Search related content from other tables
            const searchRelatedContent = async (word) => {
                setLoadingRelated(true);
                const related = [];
                const encodedWord = encodeURIComponent(word);

                const tables = [
                    { name: 'Historynt', columns: 'id,title,content', type: 'ඉතිහාසය' },
                    { name: 'answers', columns: 'id,question,answer', type: 'පිළිතුරු' },
                    { name: 'edupoint2', columns: 'id,topic,subject,link', type: 'අධ්‍යාපන සබැඳි' }
                ];

                for (const table of tables) {
                    try {
                        let query = `${SUPABASE_URL}/rest/v1/${table.name}?select=${table.columns}&limit=3`;
                        
                        if (table.name === 'Historynt') {
                            query += `&or=(title.ilike.*${encodedWord}*,content.ilike.*${encodedWord}*)`;
                        } else if (table.name === 'answers') {
                            query += `&or=(question.ilike.*${encodedWord}*,answer.ilike.*${encodedWord}*)`;
                        } else if (table.name === 'edupoint2') {
                            query += `&or=(topic.ilike.*${encodedWord}*,subject.ilike.*${encodedWord}*)`;
                        }

                        const response = await fetch(query, {
                            headers: {
                                'apikey': SUPABASE_ANON_KEY,
                                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                                'Content-Type': 'application/json'
                            }
                        });

                        if (response.ok) {
                            const data = await response.json();
                            if (data.length > 0) {
                                related.push({
                                    type: table.type,
                                    table: table.name,
                                    items: data
                                });
                            }
                        }
                    } catch (err) {
                        console.error(`Error searching ${table.name}:`, err);
                    }
                }

                setRelatedContent(related);
                setLoadingRelated(false);
            };

            // Handle word selection
            const selectWord = async (item) => {
                setSelectedWord(item);
                setSearchTerm(item.word);
                setShowSuggestions(false);
                setShowRelated(false);
                // learnX අර්ථදීපනී වලින් select කළහොත් එය modal එකේ විවෘත කරන්න
                setModalContent({ item, type: 'learnX අර්ථදීපනී' });
                setNavigationHistory([]);
                await searchRelatedContent(item.word);
            };

            // Open modal with content
            const openModal = (item, type) => {
                setModalContent({ item, type });
                setNavigationHistory([]);
            };

            // අතිරේක ලිපියකට navigate කරන්න
            const navigateToRelatedArticle = (article) => {
                // වත්මන් modal content එක history එකට add කරන්න
                setNavigationHistory(prev => [...prev, modalContent]);
                // නව article එක modal එකේ පෙන්වන්න
                setModalContent({ item: article, type: 'learnX අර්ථදීපනී' });
                // නව word එක selectedWord එකට set කරන්න (අතිරේක කියවීම් සඳහා)
                setSelectedWord(article);
            };

            // Back button - පෙර ලිපිය යළි පෙන්වන්න
            const goBack = () => {
                if (navigationHistory.length > 0) {
                    const previous = navigationHistory[navigationHistory.length - 1];
                    setModalContent(previous);
                    // selectedWord එකත් යාවත්කාලීන කරන්න
                    setSelectedWord(previous.item);
                    setNavigationHistory(prev => prev.slice(0, -1));
                }
            };

            // Modal close කරන විට history clear කරන්න
            const closeModal = () => {
                setModalContent(null);
                setNavigationHistory([]);
            };

            // Debounced search
            useEffect(() => {
                const timer = setTimeout(() => {
                    if (searchTerm && searchTerm.length >= 1) {
                        searchDictionary(searchTerm);
                    } else {
                        setSuggestions([]);
                        setShowSuggestions(false);
                    }
                }, 300);

                return () => clearTimeout(timer);
            }, [searchTerm]);

            // Click outside to close suggestions
            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (searchRef.current && !searchRef.current.contains(event.target)) {
                        setShowSuggestions(false);
                    }
                };

                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            return (
                <div className="min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-red-50 p-3 sm:p-4">
                    <div className="max-w-4xl mx-auto">
                        {/* Header */}
                        <div className="text-center mb-6 sm:mb-8 pt-4 sm:pt-8">
                            <h1 className="text-3xl sm:text-4xl font-bold text-amber-900 mb-2">
                                📚 සිංහල Smart Search
                            </h1>
                            <p className="text-amber-700 text-sm sm:text-base px-2">
                                වචනයක් type කරන්න - ස්වයංක්‍රීයව යෝජනා පෙන්වයි
                            </p>
                        </div>

                        {/* Search Box with Suggestions */}
                        <div className="relative mb-6 sm:mb-8" ref={searchRef}>
                            <div className="bg-white rounded-2xl shadow-xl p-4 sm:p-6">
                                <div className="relative">
                                    <div className="absolute left-3 sm:left-4 top-1/2 transform -translate-y-1/2 text-amber-600">
                                        <SearchIcon />
                                    </div>
                                    <input
                                        type="text"
                                        value={searchTerm}
                                        onChange={(e) => {
                                            setSearchTerm(e.target.value);
                                            setSelectedWord(null);
                                        }}
                                        onFocus={() => suggestions.length > 0 && setShowSuggestions(true)}
                                        placeholder="වචනයක් type කරන්න..."
                                        className="w-full pl-10 sm:pl-12 pr-3 sm:pr-4 py-3 sm:py-4 border-2 border-amber-200 rounded-xl focus:outline-none focus:border-amber-500 text-base sm:text-lg"
                                    />
                                </div>

                                {/* Suggestions Dropdown */}
                                {showSuggestions && suggestions.length > 0 && (
                                    <div className="mt-3 sm:mt-4 border-t-2 border-amber-100 pt-3 sm:pt-4 max-h-80 sm:max-h-96 overflow-y-auto">
                                        <p className="text-xs sm:text-sm text-amber-700 mb-2 sm:mb-3 font-semibold px-1">
                                            යෝජනා: ({suggestions.length} ප්‍රතිඵල)
                                        </p>
                                        <div className="space-y-2">
                                            {suggestions.map((item) => (
                                                <button
                                                    key={item.id}
                                                    onClick={() => selectWord(item)}
                                                    className="w-full text-left p-3 sm:p-4 bg-amber-50 hover:bg-amber-100 rounded-xl transition-all transform hover:scale-[1.02] border border-amber-200"
                                                >
                                                    <div className="flex items-start gap-2 sm:gap-3">
                                                        <div className="flex-shrink-0 mt-0.5">
                                                            <BookIcon />
                                                        </div>
                                                        <div className="flex-1 min-w-0">
                                                            <h4 className="font-bold text-amber-900 text-base sm:text-lg">{item.word}</h4>
                                                            <p className="text-gray-600 text-xs sm:text-sm mt-1 line-clamp-2">{item.meaning}</p>
                                                        </div>
                                                    </div>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* No results message */}
                                {showSuggestions && suggestions.length === 0 && searchTerm.length >= 1 && (
                                    <div className="mt-3 sm:mt-4 border-t-2 border-amber-100 pt-3 sm:pt-4">
                                        <p className="text-amber-600 text-center py-3 sm:py-4 text-sm sm:text-base">
                                            "{searchTerm}" සඳහා ප්‍රතිඵල හමු නොවීය
                                        </p>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Selected Word Display */}
                        {selectedWord && !modalContent && (
                            <div className="space-y-4 sm:space-y-6">
                                {/* Main Definition */}
                                <div className="bg-white rounded-2xl shadow-xl p-4 sm:p-6 border-l-4 border-amber-500">
                                    <div className="flex items-start gap-2 sm:gap-3 mb-3 sm:mb-4">
                                        <div className="p-1.5 sm:p-2 bg-amber-100 rounded-lg flex-shrink-0">
                                            <BookIcon />
                                        </div>
                                        <div className="flex-1 min-w-0">
                                            <h2 className="text-2xl sm:text-3xl font-bold text-amber-900 break-words">{selectedWord.word}</h2>
                                            <p className="text-xs sm:text-sm text-amber-600 mt-1">learnX අර්ථදීපනී වලින්</p>
                                        </div>
                                    </div>
                                    <div className="pl-0 sm:pl-14">
                                        <p className="text-gray-800 text-base sm:text-lg leading-relaxed">{selectedWord.meaning}</p>
                                    </div>
                                </div>

                                {/* Related Content Toggle */}
                                {relatedContent.length > 0 && !loadingRelated && !showRelated && (
                                    <button
                                        onClick={() => setShowRelated(true)}
                                        className="w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white rounded-xl p-3 sm:p-4 font-bold text-base sm:text-lg shadow-lg transition-all transform hover:scale-[1.02] flex items-center justify-center gap-2"
                                    >
                                        📖 වැඩි දුර කියවන්න ({relatedContent.reduce((sum, r) => sum + r.items.length, 0)} ප්‍රතිඵල)
                                        <ChevronDownIcon />
                                    </button>
                                )}
                                
                                {/* Hide Button */}
                                {showRelated && relatedContent.length > 0 && (
                                    <button
                                        onClick={() => setShowRelated(false)}
                                        className="w-full bg-gray-500 hover:bg-gray-600 text-white rounded-xl p-2.5 sm:p-3 font-semibold text-sm sm:text-base shadow-lg transition-all transform hover:scale-[1.02] flex items-center justify-center gap-2"
                                    >
                                        සඟවන්න
                                        <span className="transform rotate-180">
                                            <ChevronDownIcon />
                                        </span>
                                    </button>
                                )}

                                {loadingRelated && (
                                    <div className="bg-white rounded-2xl shadow-lg p-6 sm:p-8 text-center">
                                        <div className="flex justify-center mb-3">
                                            <LoaderIcon />
                                        </div>
                                        <p className="text-amber-700 text-sm sm:text-base">සම්බන්ධ තොරතුරු සොයමින්...</p>
                                    </div>
                                )}

                                {/* Related Content */}
                                {showRelated && relatedContent.length > 0 && (
                                    <div className="space-y-4 sm:space-y-6">
                                        {relatedContent.map((section, idx) => (
                                            <div key={idx} className="bg-white rounded-2xl shadow-lg p-4 sm:p-6">
                                                <h3 className="text-lg sm:text-xl font-bold text-amber-900 mb-3 sm:mb-4 flex items-center gap-2">
                                                    <span className="text-xl sm:text-2xl">📚</span>
                                                    <span className="break-words">{section.type} ({section.items.length})</span>
                                                </h3>
                                                <div className="space-y-3 sm:space-y-4">
                                                    {section.items.map((item, i) => (
                                                        <button
                                                            key={i}
                                                            onClick={() => openModal(item, section.type)}
                                                            className="w-full text-left p-3 sm:p-4 bg-amber-50 hover:bg-amber-100 rounded-lg border border-amber-100 transition-all transform hover:scale-[1.01] cursor-pointer"
                                                        >
                                                            {section.table === 'Historynt' && (
                                                                <>
                                                                    <h4 className="font-bold text-amber-900 mb-2 text-sm sm:text-base">{item.title}</h4>
                                                                    <p className="text-gray-700 text-xs sm:text-sm line-clamp-2">
                                                                        {formatContent(item.content)}
                                                                    </p>
                                                                    <p className="text-blue-600 text-xs font-semibold mt-2">සම්පූර්ණ ලිපිය කියවන්න →</p>
                                                                </>
                                                            )}
                                                            {section.table === 'answers' && (
                                                                <>
                                                                    <h4 className="font-bold text-amber-900 mb-2 text-sm sm:text-base">ප්‍රශ්නය: {item.question}</h4>
                                                                    <p className="text-gray-700 text-xs sm:text-sm line-clamp-2">
                                                                        {formatContent(item.answer)}
                                                                    </p>
                                                                    <p className="text-blue-600 text-xs font-semibold mt-2">සම්පූර්ණ පිළිතුර බලන්න →</p>
                                                                </>
                                                            )}
                                                            {section.table === 'edupoint2' && (
                                                                <>
                                                                    <h4 className="font-bold text-amber-900 mb-2 text-sm sm:text-base">{item.topic}</h4>
                                                                    <p className="text-gray-600 text-xs sm:text-sm mb-1">විෂයය: {item.subject}</p>
                                                                    <p className="text-blue-600 text-xs font-semibold mt-2">විස්තර බලන්න →</p>
                                                                </>
                                                            )}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Example Words */}
                        {!selectedWord && !searchTerm && (
                            <div className="bg-white rounded-2xl shadow-lg p-4 sm:p-6">
                                <h3 className="text-base sm:text-lg font-bold text-amber-900 mb-3">උදාහරණ වචන:</h3>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                    {['අනුරාධපුරය', 'පණ්ඩුකාභය', 'ලංකාව', 'රාජධානිය'].map((word, i) => (
                                        <button
                                            key={i}
                                            onClick={() => setSearchTerm(word)}
                                            className="px-3 sm:px-4 py-2.5 sm:py-3 bg-amber-50 hover:bg-amber-100 rounded-lg text-amber-800 font-semibold transition-colors text-left text-sm sm:text-base"
                                        >
                                            {word}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Modal */}
                    {modalContent && (
                        <ContentModal
                            item={modalContent.item}
                            type={modalContent.type}
                            searchWord={selectedWord?.word}
                            onClose={closeModal}
                            onNavigate={navigateToRelatedArticle}
                        />
                    )}

                    {/* Back Button Overlay - Modal එක විවෘතව ඇති විට සහ history තිබේ නම් */}
                    {modalContent && navigationHistory.length > 0 && (
                        <div className="fixed top-4 left-4 z-[60]">
                            <button
                                onClick={goBack}
                                className="bg-amber-600 hover:bg-amber-700 text-white px-4 sm:px-6 py-2.5 sm:py-3 rounded-full shadow-2xl font-bold text-sm sm:text-base flex items-center gap-2 transition-all transform hover:scale-105"
                            >
                                <svg className="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                                </svg>
                                <span>ආපසු යන්න</span>
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
