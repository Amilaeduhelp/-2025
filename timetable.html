        function loadAllSubjects() {
            const container = document.getElementById('subjectsContainer');
            let html = '';
            
            const sortedCodes = Object.keys(allSubjects).sort((a, b) => parseInt(a) - parseInt(b));
            
            sortedCodes.forEach(code => {
                const sub = allSubjects[code];
                html += `<div class="subject-checkbox" id="checkbox-${code}">
                    <input type="checkbox" id="sub-${code}" value="${code}" onchange="updateSelection('${code}')">
                    <span class="subject-code">${code}</span>
                    <label for="sub-${code}">${sub.si}</label>
                </div>`;
            });
            
            container.innerHTML = html;
        }
        
        function updateSelection(code) {
            const cb = document.getElementById(`sub-${code}`);
            const div = document.getElementById(`checkbox-${code}`);
            
            if (cb.checked) {
                if (!selectedSubjects.includes(code)) {
                    selectedSubjects.push(code);
                }
                div.classList.add('checked');
            } else {
                selectedSubjects = selectedSubjects.filter(c => c !== code);
                div.classList.remove('checked');
            }
        }
        
        function generateReport() {
            if (selectedSubjects.length === 0) {
                alert('කරුණාකර අවම වශයෙන් විෂයයක් තෝරන්න!');
                return;
            }
            
            const examDays = [];
            const freeDays = [];
            const allDates = Object.keys(timetableData);
            
            allDates.forEach(dateKey => {
                const dayData = timetableData[dateKey];
                const hasExam = dayData.exams.some(exam => selectedSubjects.includes(exam.code));
                
                if (hasExam) {
                    const myExams = dayData.exams.filter(exam => selectedSubjects.includes(exam.code));
                    examDays.push({...dayData, date: dateKey, myExams});
                } else {
                    freeDays.push({...dayData, date: dateKey});
                }
            });
            
            displayReport(examDays, freeDays);
        }

            const reportPanel = document.getElementById('reportPanel');
            const selectionPanel = document.getElementById('selectionPanel');
            
            let html = `<div class="action-buttons">

            </div>`;
            
            html += `<div class="report-header">

                <div class="selected-subjects">`;
            
            selectedSubjects.sort((a, b) => parseInt(a) - parseInt(b)).forEach(code => {

            html += `</div>`;
            
            // December Calendar
            html += `<div class="month-title">දෙසැම්බර් 2025</div>`;
            html += `<div class="calendar-grid">`;
            html += `<div class="calendar-day-header">සඳු</div>
                     <div class="calendar-day-header">අඟ</div>
                     <div class="calendar-day-header">බදා</div>
                     <div class="calendar-day-header">බ්‍රහස්</div>
                     <div class="calendar-day-header">සිකු</div>
                     <div class="calendar-day-header">සෙන</div>
                     <div class="calendar-day-header">ඉරි</div>`;
            
            // December days (1-5)
            for (let i = 1; i <= 5; i++) {
                const dateKey = `Dec 0${i}`;
                let dayClass = 'calendar-day';
                let label = '';
                
                if (examDates.has(dateKey)) {
                    dayClass += ' exam-day';
                    const examDay = examDays.find(d => d.date === dateKey);
                    if (examDay) {
                        label = `${examDay.myExams.length} විභාග`;
                    }
                } else if (freeDates.has(dateKey)) {
                    dayClass += ' free-day';
                    label = 'නිදහස්';
                }
                
                html += `<div class="${dayClass}">
                    <div class="calendar-day-number">${i}</div>
                    ${label ? `<div class="calendar-day-label">${label}</div>` : ''}
                </div>`;
            }
            
            // Fill rest with empty cells
            for (let i = 5; i < 7; i++) {
                html += `<div class="calendar-day empty"></div>`;
            }
            
            html += `</div></div>`;
            
            return html;
        }
        
        function generateWhatsAppText(examDays, freeDays) {
            let text = `🎓 *A/L විභාග කාලසටහන 2025*\n`;
            text += `━━━━━━━━━━━━━━━━━━━\n\n`;
            
            text += `📚 *තෝරාගත් විෂයයන්:*\n`;
            selectedSubjects.sort((a, b) => parseInt(a) - parseInt(b)).forEach(code => {
                text += `• ${code} - ${allSubjects[code].si}\n`;
            });
            
            text += `\n📊 *සාරාංශය:*\n`;
            text += `• විෂයයන්: ${selectedSubjects.length}\n`;
            text += `• විභාග දින: ${examDays.length}\n`;
            text += `• නිදහස් දින: ${freeDays.length}\n`;
            
            text += `\n━━━━━━━━━━━━━━━━━━━\n`;
            text += `📝 *විභාග පවත්වන දින:*\n\n`;
            
            examDays.forEach(day => {
                text += `📅 *${day.day} - ${day.date}*\n`;
                day.myExams.forEach(exam => {
                    const subject = allSubjects[exam.code];
                    const paperText = exam.paper ? ` (පත්‍රිකාව ${exam.paper})` : '';
                    text += `   🔹 ${exam.code} - ${subject.si}${paperText}\n`;
                    text += `      ⏰ ${exam.time}\n`;
                });
                text += `\n`;
            });
            
            if (freeDays.length > 0) {
                text += `━━━━━━━━━━━━━━━━━━━\n`;
                text += `✨ *නිදහස් දින (අධ්‍යයනය සඳහා):*\n\n`;
                freeDays.forEach(day => {
                    text += `📗 ${day.day} - ${day.date}\n`;
                });
            }
            
            text += `\n━━━━━━━━━━━━━━━━━━━\n`;
            text += `💪 සුභ පැතුම්! ජයග්‍රහණය ඔබ සමඟ!\n`;
            
            return text;
        }
        
        function copyToClipboard() {
            const examDays = [];
            const freeDays = [];
            const allDates = Object.keys(timetableData);
            
            allDates.forEach(dateKey => {
                const dayData = timetableData[dateKey];
                const hasExam = dayData.exams.some(exam => selectedSubjects.includes(exam.code));
                
                if (hasExam) {
                    const myExams = dayData.exams.filter(exam => selectedSubjects.includes(exam.code));
                    examDays.push({...dayData, date: dateKey, myExams});
                } else {
                    freeDays.push({...dayData, date: dateKey});
                }
            });
            
            const text = generateWhatsAppText(examDays, freeDays);
            
            navigator.clipboard.writeText(text).then(() => {
                showToast('✅ වාර්තාව පිටපත් කරන ලදී!');
            }).catch(() => {
                showToast('❌ පිටපත් කිරීම අසාර්ථක විය');
            });
        }
        
        function shareToWhatsApp() {
            const examDays = [];
            const freeDays = [];
            const allDates = Object.keys(timetableData);
            
            allDates.forEach(dateKey => {
                const dayData = timetableData[dateKey];
                const hasExam = dayData.exams.some(exam => selectedSubjects.includes(exam.code));
                
                if (hasExam) {
                    const myExams = dayData.exams.filter(exam => selectedSubjects.includes(exam.code));
                    examDays.push({...dayData, date: dateKey, myExams});
                } else {
                    freeDays.push({...dayData, date: dateKey});
                }
            });
            
            const text = generateWhatsAppText(examDays, freeDays);
            const encodedText = encodeURIComponent(text);
            const whatsappUrl = `https://wa.me/?text=${encodedText}`;
            
            window.open(whatsappUrl, '_blank');
        }
        
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
        
        function backToSelection() {
            document.getElementById('reportPanel').classList.remove('show');
            document.getElementById('selectionPanel').style.display = 'block';
        }
        
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            if (tab === 'full') {
                document.querySelector('.tab:first-child').classList.add('active');
                document.getElementById('fullTab').classList.add('active');
            } else {
                document.querySelector('.tab:last-child').classList.add('active');
                document.getElementById('myTab').classList.add('active');
            }
        }
        
        loadAllSubjects();
    </script>
</body>
</html>
