        function loadSubjectsByStream() {
            const stream = document.getElementById('streamSelect').value;
            const container = document.getElementById('subjectsContainer');
            const submitBtn = document.getElementById('submitBtn');
            
            if (!stream) {
                container.innerHTML = '';
                submitBtn.disabled = true;
                return;
            }

            const subjects = streamSubjects[stream];
            let html = '';

            subjects.forEach(code => {
                const subject = allSubjects[code];
                if (subject) {
                    html += `
                        <div class="subject-checkbox" id="checkbox-${code}">
                            <input type="checkbox" id="sub-${code}" value="${code}" 
                                   onchange="updateSelection('${code}')">
                            <label for="sub-${code}">${subject.si}</label>
                        </div>
                    `;
                }
            });

            container.innerHTML = html;
            submitBtn.disabled = false;
            selectedSubjects = [];
        }

        function updateSelection(code) {
            const checkbox = document.getElementById(`sub-${code}`);
            const checkboxDiv = document.getElementById(`checkbox-${code}`);
            
            if (checkbox.checked) {
                selectedSubjects.push(code);
                checkboxDiv.classList.add('checked');
            } else {
                selectedSubjects = selectedSubjects.filter(c => c !== code);
                checkboxDiv.classList.remove('checked');
            }
        }

        function generateReport() {
            if (selectedSubjects.length === 0) {
                alert('කරුණාකර අවම වශයෙන් විෂයයක් තෝරන්න!');
                return;
            }

            const examDays = [];
            const freeDays = [];
            const allDates = Object.keys(timetableData);

            allDates.forEach(dateKey => {
                const dayData = timetableData[dateKey];
                const hasExam = dayData.exams.some(exam => selectedSubjects.includes(exam.code));
                
                if (hasExam) {
                    const myExams = dayData.exams.filter(exam => selectedSubjects.includes(exam.code));
                    examDays.push({...dayData, date: dateKey, myExams});
                } else {
                    freeDays.push({...dayData, date: dateKey});
                }
            });

            displayReport(examDays, freeDays);
        }

        function switchTab(tab) {
            const tabs = document.querySelectorAll('.tab');
            const tabContents = document.querySelectorAll('.tab-content');
            
            tabs.forEach(t => t.classList.remove('active'));
            tabContents.forEach(tc => tc.classList.remove('active'));
            
            if (tab === 'full') {
                tabs[0].classList.add('active');
                document.getElementById('fullTab').classList.add('active');
            } else {
                tabs[1].classList.add('active');
                document.getElementById('myTab').classList.add('active');
            }
        }

            currentLang = lang;

            buttons.forEach(btn => btn.classList.remove('active'));
