<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LearnX - Login</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 1rem;
}

.login-container {
  background: white;
  border-radius: 16px;
  padding: 2.5rem;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  max-width: 420px;
  width: 100%;
  animation: slideUp 0.5s ease;
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.logo {
  text-align: center;
  margin-bottom: 2rem;
}

.logo h1 {
  color: #667eea;
  font-size: 2.5rem;
  margin-bottom: 0.5rem;
}

.logo p {
  color: #666;
  font-size: 0.95rem;
}

.form-group {
  margin-bottom: 1.5rem;
}

label {
  display: block;
  margin-bottom: 0.5rem;
  color: #333;
  font-weight: 600;
  font-size: 0.95rem;
}

input {
  width: 100%;
  padding: 0.875rem;
  border: 2px solid #e0e0e0;
  border-radius: 8px;
  font-size: 1rem;
  transition: all 0.3s;
}

input:focus {
  outline: none;
  border-color: #667eea;
  box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

.btn-login {
  width: 100%;
  padding: 1rem;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
  margin-top: 1rem;
}

.btn-login:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
}

.btn-login:disabled {
  background: #ccc;
  cursor: not-allowed;
  transform: none;
}

.message {
  padding: 1rem;
  border-radius: 8px;
  margin-bottom: 1.5rem;
  display: none;
  animation: slideIn 0.3s;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateX(-20px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

.message.show {
  display: block;
}

.message.error {
  background: #fee;
  color: #c33;
  border: 1px solid #fcc;
}

.message.success {
  background: #efe;
  color: #3c3;
  border: 1px solid #cfc;
}

.message.info {
  background: #e7f3ff;
  color: #1976D2;
  border: 1px solid #90caf9;
}

.footer {
  text-align: center;
  margin-top: 2rem;
  color: #999;
  font-size: 0.85rem;
}

.redirect-message {
  text-align: center;
  padding: 2rem;
}

.redirect-message h2 {
  color: #667eea;
  margin-bottom: 1rem;
  font-size: 1.8rem;
}

.redirect-message p {
  color: #666;
  font-size: 1rem;
  margin-bottom: 1.5rem;
}

.spinner {
  border: 4px solid #f3f3f3;
  border-top: 4px solid #667eea;
  border-radius: 50%;
  width: 50px;
  height: 50px;
  animation: spin 1s linear infinite;
  margin: 2rem auto;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>
</head>
<body>

<div class="login-container">
  <div id="loginSection">
    <div class="logo">
      <h1>📚 LearnX</h1>
      <p>පුරනය වන්න</p>
    </div>
    
    <div class="message" id="message"></div>
    
    <!-- Login Form -->
    <form id="loginForm">
      <div class="form-group">
        <label for="accessCode">Access Code</label>
        <input type="text" id="accessCode" placeholder="ඔබගේ access code එක ඇතුළත් කරන්න" required>
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="ඔබගේ password එක ඇතුළත් කරන්න" required>
      </div>
      
      <button type="submit" class="btn-login" id="loginBtn">
        🔐 පුරනය වන්න
      </button>
    </form>
    
    <div class="footer">
      <p>© 2025 LearnX - අමිල උඩවත්ත</p>
    </div>
  </div>
  
  <!-- Redirect Screen (shown after successful login) -->
  <div class="redirect-message" id="redirectSection" style="display: none;">
    <h2>✅ සාර්ථකයි!</h2>
    <p>ඔබ සාර්ථකව පුරනය වී ඇත</p>
    <div class="spinner"></div>
    <p>පිටුව විවෘත කරමින්...</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let supabase = null;

// Supabase Configuration - ස්ථිරව සකසා ඇත
const SUPABASE_URL = 'https://uqgzlaxsnknheoerbfus.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVxZ3psYXhzbmtuaGVvZXJiZnVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQ4MDQzMTEsImV4cCI6MjA2MDM4MDMxMX0.O5dNUizqZ5kfwTs0mHLEorqOAqjZFjWakp2Q484MKEk';

// Redirect URL - මෙම URL එක ඔබගේ අවශ්‍යතාවයට අනුව වෙනස් කරන්න
const REDIRECT_URL = 'https://amilaeduhelp.github.io/-2025/entrence.html';

function hash(str) {
  return CryptoJS.SHA256(str).toString();
}

function showMessage(message, type) {
  const msgEl = document.getElementById('message');
  msgEl.textContent = message;
  msgEl.className = `message show ${type}`;
  
  setTimeout(() => {
    msgEl.classList.remove('show');
  }, 5000);
}

function initSupabase() {
  try {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    return true;
  } catch (error) {
    showMessage('❌ Supabase සම්බන්ධ කිරීමේ දෝෂයක්: ' + error.message, 'error');
    return false;
  }
}

function redirectToPage(userData) {
  // User data එක sessionStorage එකට save කරන්න (optional)
  sessionStorage.setItem('learnx_user', JSON.stringify({
    access_code: userData.access_code,
    created_at: userData.created_at,
    last_login: userData.last_login
  }));
  
  // Redirect screen එක පෙන්වන්න
  document.getElementById('loginSection').style.display = 'none';
  document.getElementById('redirectSection').style.display = 'block';
  
  // 2 seconds පසු redirect කරන්න
  setTimeout(() => {
    window.location.href = REDIRECT_URL;
  }, 2000);
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  if (!supabase) {
    initSupabase();
  }
  
  const accessCode = document.getElementById('accessCode').value.trim().toUpperCase();
  const password = document.getElementById('password').value;
  
  if (!accessCode || !password) {
    showMessage('⚠️ කරුණාකර සියලු තොරතුරු පුරවන්න', 'error');
    return;
  }
  
  const loginBtn = document.getElementById('loginBtn');
  loginBtn.disabled = true;
  loginBtn.textContent = '🔄 පරීක්ෂා කරමින්...';
  
  try {
    const passwordHash = hash(password);
    
    const { data, error } = await supabase
      .from('credentials')
      .select('*')
      .eq('access_code', accessCode)
      .eq('password_hash', passwordHash)
      .single();
    
    if (error || !data) {
      showMessage('❌ වැරදි Access Code හෝ Password', 'error');
      loginBtn.disabled = false;
      loginBtn.textContent = '🔐 පුරනය වන්න';
      return;
    }
    
    if (!data.is_active) {
      showMessage('⚠️ මෙම ගිණුම අක්‍රීය කර ඇත', 'error');
      loginBtn.disabled = false;
      loginBtn.textContent = '🔐 පුරනය වන්න';
      return;
    }
    
    const createdDate = new Date(data.created_at);
    const expiryDate = new Date(createdDate);
    expiryDate.setDate(expiryDate.getDate() + 365);
    
    if (new Date() > expiryDate) {
      showMessage('⚠️ ඔබගේ ගිණුම කල් ඉකුත් වී ඇත', 'error');
      loginBtn.disabled = false;
      loginBtn.textContent = '🔐 පුරනය වන්න';
      return;
    }
    
    // Last login update කරන්න
    await supabase
      .from('credentials')
      .update({ last_login: new Date().toISOString() })
      .eq('access_code', accessCode);
    
    // සාර්ථක පුරනයෙන් පසු redirect කරන්න
    redirectToPage(data);
    
  } catch (error) {
    console.error('Login error:', error);
    showMessage('❌ දෝෂයක් ඇතිවිය: ' + error.message, 'error');
    loginBtn.disabled = false;
    loginBtn.textContent = '🔐 පුරනය වන්න';
  }
});

// Page load වෙද්දී Supabase initialize කරන්න
window.addEventListener('DOMContentLoaded', () => {
  initSupabase();
});
</script>

</body>
</html>
