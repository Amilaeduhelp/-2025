<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>සටහන් පොත</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans Sinhala', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 1000px;
            margin: 0 auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; color: #333; margin-bottom: 30px; font-size: 2.5em; }
        .nav-sidebar {
            position: fixed;
            left: -350px;
            top: 0;
            width: 350px;
            height: 100vh;
            background: white;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            transition: left 0.3s ease;
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }
        .nav-sidebar.open { left: 0; }
        .nav-sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #667eea;
        }
        .nav-sidebar-header h3 { color: #667eea; font-size: 1.3em; margin: 0; }
        .nav-close-btn {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: #667eea;
            padding: 5px 10px;
        }
        .nav-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 999;
        }
        .nav-overlay.active { display: block; }
        .nav-item {
            padding: 10px 15px;
            margin: 5px 0;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.2s;
            line-height: 1.5;
        }
        .nav-item:hover { background: #f0f0f0; }
        .nav-item.h1 {
            font-weight: bold;
            font-size: 1.1em;
            color: #667eea;
            margin-top: 15px;
            border-left: 4px solid #667eea;
        }
        .nav-item.h2 {
            padding-left: 25px;
            color: #555;
            font-size: 1em;
            border-left: 3px solid #ccc;
            margin-left: 10px;
        }
        .nav-item.h3 {
            padding-left: 40px;
            color: #777;
            font-size: 0.95em;
            border-left: 2px solid #ddd;
            margin-left: 20px;
        }
        .section-anchor { scroll-margin-top: 80px; }
        .category-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .category-tab {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Noto Sans Sinhala', sans-serif;
            background: #f0f0f0;
            color: #555;
        }
        .category-tab.slhis.active { background: #4285f4; color: white; }
        .category-tab.erphis.active { background: #ea4335; color: white; }
        .category-tab.indhis.active { background: #34a853; color: white; }
        .universal-search-box {
            width: 100%;
            padding: 15px;
            border: 3px solid #667eea;
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Noto Sans Sinhala', sans-serif;
            margin-bottom: 20px;
            background: linear-gradient(to right, #fff, #f8f9ff);
        }
        .universal-search-box:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }
        #universalSearchResults {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        .universal-result-item {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-left: 4px solid #667eea;
        }
        .universal-result-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .result-title {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 8px;
            font-size: 1.1em;
        }
        .result-preview {
            color: #555;
            line-height: 1.6;
        }
        .result-preview mark {
            background-color: #ffeb3b;
            padding: 2px 4px;
            border-radius: 2px;
            font-weight: bold;
        }
        .lesson-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            max-height: 300px;
            overflow-y: auto;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        .lesson-item {
            padding: 15px;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
            font-weight: 500;
        }
        .lesson-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .lesson-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .book-link {
            display: block;
            padding: 15px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .book-link:hover { transform: translateY(-2px); }
        .search-container { position: relative; margin-bottom: 20px; }
        #searchBox {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Noto Sans Sinhala', sans-serif;
        }
        .search-results-info {
            margin-top: 10px;
            text-align: center;
            color: #667eea;
            font-weight: bold;
        }
        .search-nav-buttons {
            display: none;
            gap: 10px;
            margin-top: 10px;
            justify-content: center;
        }
        .search-nav-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-size: 18px;
        }
        .page-indicator {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            font-weight: bold;
            color: white;
            display: none;
            font-size: 1.1em;
        }
        .note-area {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 100px;
            min-height: 400px;
            line-height: 1.8;
            font-size: 18px;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        .note-area h1, .note-area h2, .note-area h3 {
            color: #667eea;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        .note-area p { margin-bottom: 15px; }
        .loading {
            text-align: center;
            color: #667eea;
            padding: 40px;
            font-size: 1.2em;
        }
        .tooltip {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            color: white;
            padding: 20px 30px;
            border-radius: 15px;
            display: none;
            z-index: 1001;
            max-width: 500px;
            max-height: 70vh;
            overflow-y: auto;
            font-size: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            line-height: 1.6;
        }
        .tooltip-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 1000;
        }
        .dictionary-word {
            color: #2196F3;
            font-weight: 600;
            cursor: help;
            border-bottom: 2px dotted #2196F3;
            transition: all 0.2s;
        }
        .dictionary-word:hover {
            background: rgba(33, 150, 243, 0.1);
            padding: 2px 4px;
            border-radius: 3px;
        }
        .button-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            background: linear-gradient(to top, rgba(255,255,255,0.98) 0%, rgba(255,255,255,0.95) 100%);
            padding: 15px 20px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
            z-index: 900;
            backdrop-filter: blur(10px);
        }
        .button-container button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
            min-width: 50px;
        }
        #navBtn { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        #prevLessonBtn, #nextLessonBtn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        #increaseBtn, #decreaseBtn { background: linear-gradient(135deg, #34a853 0%, #2d9248 100%); }
        .button-container button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        mark {
            background-color: yellow;
            padding: 2px 4px;
            border-radius: 2px;
        }
        @media (max-width: 768px) {
            .container { padding: 20px; }
            h1 { font-size: 1.8em; }
            .nav-sidebar { width: 280px; left: -280px; }
            .lesson-list { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
        }
    </style>
</head>
<body>
    <div class="nav-overlay" id="navOverlay"></div>
    <div class="nav-sidebar" id="navSidebar">
        <div class="nav-sidebar-header">
            <h3>📑 පිටු සංචරණය</h3>

        </div>

        <a href="https://amilaeduhelp.github.io/book-price/" target="_blank" class="book-link">📚 මෙම සටහන ඇතුළු සම්පූර්ණ සටහන් ඇතුළත් මුද්‍රිත පොත ලබාගැනීම සඳහා මෙතැනින් පිවිසෙන්න</a>
        <div class="search-container">
            <input type="text" id="searchBox" placeholder="වත්මන් පාඩමෙන් සෙවීමට වචනයක් ඇතුලත් කරන්න...">
            <div class="search-results-info" id="searchInfo"></div>
            <div class="search-nav-buttons" id="searchNavButtons">
                <button class="search-nav-btn" id="prevSearchBtn">▲</button>
                <button class="search-nav-btn" id="nextSearchBtn">▼</button>
            </div>
        </div>
        <div class="page-indicator" id="pageIndicator"></div>
        <div class="tooltip-overlay" id="tooltipOverlay"></div>
        <div class="tooltip" id="tooltip"></div>
        <div class="note-area" id="noteArea">
            <div class="loading">කරුණාකර කාණ්ඩයක් තෝරන්න...</div>
        </div>
        <div class="button-container">
            <button id="navBtn" title="පිටු සංචරණය">📑</button>
            <button id="prevLessonBtn" title="පෙර පාඩම">◄</button>
            <button id="nextLessonBtn" title="ඊළඟ පාඩම">►</button>
            <button id="increaseBtn" title="විශාල කරන්න">+</button>
            <button id="decreaseBtn" title="කුඩා කරන්න">-</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 73) || (e.ctrlKey && e.shiftKey && e.keyCode == 74) || (e.ctrlKey && e.keyCode == 85) || (e.ctrlKey && e.keyCode == 67) || (e.ctrlKey && e.keyCode == 65) || (e.ctrlKey && e.keyCode == 88) || (e.metaKey && e.keyCode == 67) || (e.metaKey && e.keyCode == 65) || (e.metaKey && e.keyCode == 88)) {
                e.preventDefault();
            }
        });
        document.addEventListener('copy', e => e.preventDefault());
        document.addEventListener('cut', e => e.preventDefault());

        const SUPABASE_URL = 'https://uqgzlaxsnknheoerbfus.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVxZ3psYXhzbmtuaGVvZXJiZnVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5MjM2MTUsImV4cCI6MjA3OTI4MzYxNX0.IYWZ7ukx8J-GJMWy7cMk2BWnmzJmJjjE93yEmJie7nQ';
        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const pediaClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let state = {
            currentCategory: 'slhis',
            currentLessons: [],
            currentLessonIndex: 0,
            fontSize: 18,
            searchMatches: [],
            currentSearchIndex: 0,
            dictionaryWords: {}
        };

        document.addEventListener('DOMContentLoaded', () => {
            setupEventListeners();
            loadDictionary().then(() => loadLessons(state.currentCategory));
        });

        function setupEventListeners() {
            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    state.currentCategory = tab.dataset.category;
                    loadLessons(state.currentCategory);
                });
            });
            const btn = id => document.getElementById(id);
            btn('navBtn').addEventListener('click', toggleNavSidebar);
            btn('navCloseBtn').addEventListener('click', toggleNavSidebar);
            btn('navOverlay').addEventListener('click', toggleNavSidebar);
            btn('prevLessonBtn').addEventListener('click', () => navigateLesson(-1));
            btn('nextLessonBtn').addEventListener('click', () => navigateLesson(1));
            btn('increaseBtn').addEventListener('click', () => changeFontSize(2));
            btn('decreaseBtn').addEventListener('click', () => changeFontSize(-2));
            btn('searchBox').addEventListener('input', handleSearch);
            btn('prevSearchBtn').addEventListener('click', () => navigateSearch(-1));
            btn('nextSearchBtn').addEventListener('click', () => navigateSearch(1));
            btn('tooltipOverlay').addEventListener('click', hideTooltip);
            btn('universalSearchBox').addEventListener('input', handleUniversalSearch);
        }

        function loadDictionary() {
            return pediaClient.from('learnX pedia').select('word, meaning').then(res => {
                if (res.error) throw res.error;
                res.data.forEach(item => {
                    state.dictionaryWords[item.word.trim()] = item.meaning;
                });
                console.log('Dictionary loaded:', Object.keys(state.dictionaryWords).length, 'words');
            }).catch(err => console.error('Error loading dictionary:', err));
        }

        function loadLessons(category) {
            document.getElementById('noteArea').innerHTML = '<div class="loading">පාඩම් පූරණය වෙමින්...</div>';
            sbClient.from('Historynt').select('*').like('slug', category + '%').order('slug', { ascending: true }).then(res => {
                if (res.error) throw res.error;
                state.currentLessons = res.data;
                state.currentLessonIndex = 0;
                displayLessonList();
                if (state.currentLessons.length > 0) displayLesson(0);
            }).catch(err => {
                console.error('Error loading lessons:', err);
                document.getElementById('noteArea').innerHTML = '<div class="loading">දත්ත පූරණය කිරීමේ දෝෂයක් සිදුවිය!</div>';
            });
        }

        function displayLessonList() {
            const lessonList = document.getElementById('lessonList');
            if (state.currentLessons.length === 0) {
                lessonList.innerHTML = '<div class="loading">පාඩම් නොමැත</div>';
                return;
            }
            lessonList.innerHTML = state.currentLessons.map((lesson, i) => 
                `<div class="lesson-item ${i === state.currentLessonIndex ? 'active' : ''}" onclick="displayLesson(${i})">${lesson.title}</div>`
            ).join('');
        }

        function displayLesson(index) {
            if (index < 0 || index >= state.currentLessons.length) return;
            state.currentLessonIndex = index;
            const lesson = state.currentLessons[index];
            document.getElementById('pageTitle').textContent = lesson.title;
            const pageIndicator = document.getElementById('pageIndicator');
            pageIndicator.style.display = 'block';
            pageIndicator.textContent = `පාඩම ${index + 1} / ${state.currentLessons.length}`;
            const contentWithNav = addNavigationIds(lesson.content);
            const noteArea = document.getElementById('noteArea');
            noteArea.innerHTML = highlightDictionaryWords(contentWithNav);
            noteArea.style.fontSize = state.fontSize + 'px';
            setupDictionaryWordListeners();
            displayLessonList();
            generateNavigationMenu(lesson.content);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function addNavigationIds(content) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            tempDiv.querySelectorAll('h1, h2, h3').forEach((h, i) => {
                h.id = 'section-' + i;
                h.classList.add('section-anchor');
            });
            return tempDiv.innerHTML;
        }

        function generateNavigationMenu(content) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            const headings = tempDiv.querySelectorAll('h1, h2, h3');
            const navContent = document.getElementById('navContent');
            if (headings.length === 0) {
                navContent.innerHTML = '<div class="nav-empty-state"><p>මාතෘකා නොමැත</p></div>';
                return;
            }
            navContent.innerHTML = Array.from(headings).map((h, i) => 
                `<div class="nav-item ${h.tagName.toLowerCase()}" onclick="scrollToSection('section-${i}')">${h.textContent}</div>`
            ).join('');
        }

        function highlightDictionaryWords(content) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            const walker = document.createTreeWalker(tempDiv, NodeFilter.SHOW_TEXT, null, false);
            const textNodes = [];
            let node;
            while (node = walker.nextNode()) textNodes.push(node);
            
            const sortedWords = Object.keys(state.dictionaryWords).sort((a, b) => b.length - a.length);
            
            textNodes.forEach(textNode => {
                const originalText = textNode.textContent;
                const processedRanges = [];
                const replacements = [];
                
                sortedWords.forEach(word => {
                    let searchIndex = 0;
                    while (searchIndex < originalText.length) {
                        const foundIndex = originalText.indexOf(word, searchIndex);
                        if (foundIndex === -1) break;
                        
                        const charBefore = foundIndex > 0 ? originalText.charAt(foundIndex - 1) : ' ';
                        const charAfter = foundIndex + word.length < originalText.length ? originalText.charAt(foundIndex + word.length) : ' ';
                        const boundaries = ' .,!?;:\n\r\t';
                        const isWordBoundary = (foundIndex === 0 || boundaries.indexOf(charBefore) !== -1) && 
                                               (foundIndex + word.length === originalText.length || boundaries.indexOf(charAfter) !== -1);
                        
                        if (isWordBoundary) {
                            const overlaps = processedRanges.some(range => 
                                !(foundIndex + word.length <= range.start || foundIndex >= range.end)
                            );
                            if (!overlaps) {
                                processedRanges.push({start: foundIndex, end: foundIndex + word.length});
                                replacements.push({index: foundIndex, length: word.length, word: word});
                            }
                        }
                        searchIndex = foundIndex + 1;
                    }
                });
                
                if (replacements.length > 0) {
                    replacements.sort((a, b) => b.index - a.index);
                    let result = originalText;
                    replacements.forEach(r => {
                        const before = result.substring(0, r.index);
                        const middle = result.substring(r.index, r.index + r.length);
                        const after = result.substring(r.index + r.length);
                        result = before + `<span class="dictionary-word" data-word="${r.word}">${middle}</span>` + after;
                    });
                    const span = document.createElement('span');
                    span.innerHTML = result;
                    textNode.replaceWith(span);
                }
            });
            return tempDiv.innerHTML;
        }

        function setupDictionaryWordListeners() {
            document.querySelectorAll('.dictionary-word').forEach(el => {
                el.addEventListener('click', e => {
                    e.stopPropagation();
                    const word = el.dataset.word;
                    const meaning = state.dictionaryWords[word];
                    if (meaning) showTooltip(e.clientX, e.clientY, word, meaning);
                });
            });
        }

        function showTooltip(x, y, word, meaning) {
            const tooltip = document.getElementById('tooltip');
            const overlay = document.getElementById('tooltipOverlay');
            tooltip.innerHTML = `<strong style="color: #2196F3; font-size: 18px;">${word}</strong><br><br>${meaning}`;
            tooltip.style.display = 'block';
            overlay.style.display = 'block';
        }

        function hideTooltip() {
            document.getElementById('tooltip').style.display = 'none';
            document.getElementById('tooltipOverlay').style.display = 'none';
        }

        function scrollToSection(id) {
            const element = document.getElementById(id);
            if (element) {
                element.scrollIntoView({ behavior: 'smooth', block: 'start' });
                toggleNavSidebar();
            }
        }

        function toggleNavSidebar() {
            document.getElementById('navSidebar').classList.toggle('open');
            document.getElementById('navOverlay').classList.toggle('active');
        }

        function navigateLesson(direction) {
            const newIndex = state.currentLessonIndex + direction;
            if (newIndex >= 0 && newIndex < state.currentLessons.length) displayLesson(newIndex);
        }

        function changeFontSize(change) {
            state.fontSize = Math.max(14, Math.min(28, state.fontSize + change));
            document.getElementById('noteArea').style.fontSize = state.fontSize + 'px';
        }

        function handleSearch() {
            const searchTerm = document.getElementById('searchBox').value.trim();
            const noteArea = document.getElementById('noteArea');
            noteArea.innerHTML = noteArea.innerHTML.replace(/<mark>/g, '').replace(/<\/mark>/g, '');
            state.searchMatches = [];
            state.currentSearchIndex = 0;
            if (!searchTerm) {
                document.getElementById('searchInfo').textContent = '';
                document.getElementById('searchNavButtons').style.display = 'none';
                return;
            }
            const content = noteArea.textContent;
            const regex = new RegExp(searchTerm, 'gi');
            const matches = content.match(regex);
            if (matches) {
                state.searchMatches = matches;
                noteArea.innerHTML = noteArea.innerHTML.replace(new RegExp(searchTerm, 'gi'), match => `<mark>${match}</mark>`);
                document.getElementById('searchInfo').textContent = `${matches.length} ප්‍රතිඵල හමුවිය`;
                document.getElementById('searchNavButtons').style.display = 'flex';
                const firstMark = noteArea.querySelector('mark');
                if (firstMark) firstMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else {
                document.getElementById('searchInfo').textContent = 'ප්‍රතිඵල හමු නොවීය';
                document.getElementById('searchNavButtons').style.display = 'none';
            }
        }

        function navigateSearch(direction) {
            if (state.searchMatches.length === 0) return;
            state.currentSearchIndex += direction;
            if (state.currentSearchIndex < 0) state.currentSearchIndex = state.searchMatches.length - 1;
            if (state.currentSearchIndex >= state.searchMatches.length) state.currentSearchIndex = 0;
            const marks = document.querySelectorAll('mark');
            if (marks[state.currentSearchIndex]) {
                marks[state.currentSearchIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function handleUniversalSearch() {
            const searchTerm = document.getElementById('universalSearchBox').value.trim();
            const resultsDiv = document.getElementById('universalSearchResults');
            
            if (!searchTerm || searchTerm.length < 2) {
                resultsDiv.innerHTML = '';
                return;
            }
            
            resultsDiv.innerHTML = '<div class="loading">සොයමින්...</div>';
            
            sbClient.from('Historynt').select('*').ilike('content', `%${searchTerm}%`).order('slug', { ascending: true }).then(res => {
                if (res.error) throw res.error;
                
                if (res.data.length === 0) {
                    resultsDiv.innerHTML = '<div style="text-align: center; padding: 20px; color: #667eea;">ප්‍රතිඵල හමු නොවීය</div>';
                    return;
                }
                
                let html = `<div style="margin-bottom: 10px; font-weight: bold; color: #667eea;">${res.data.length} ප්‍රතිඵල හමුවිය:</div>`;
                
res.data.forEach(lesson => {
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = lesson.content;
                    const textContent = tempDiv.textContent || tempDiv.innerText;
                    const searchIndex = textContent.toLowerCase().indexOf(searchTerm.toLowerCase());
                    const contextStart = Math.max(0, searchIndex - 100);
                    const contextEnd = Math.min(textContent.length, searchIndex + searchTerm.length + 100);
                    let preview = textContent.substring(contextStart, contextEnd);
                    if (contextStart > 0) preview = '...' + preview;
                    if (contextEnd < textContent.length) preview = preview + '...';
                    preview = preview.replace(new RegExp(`\\S*${searchTerm}\\S*`, 'gi'), '<mark>$&</mark>');
                    const categoryName = lesson.slug.startsWith('slhis') ? 'ශ්‍රී ලංකාව' : 
                                       lesson.slug.startsWith('erphis') ? 'යුරෝපය' : 'ඉන්දියාව';
                    html += `<div class="universal-result-item" onclick="openUniversalResult('${lesson.slug}')">
                            <div class="result-title">${lesson.title} (${categoryName})</div>
                            <div class="result-preview">${preview}</div>
                            </div>`;
                });
                resultsDiv.innerHTML = html;
            }).catch(err => {
                console.error('Universal search error:', err);
                resultsDiv.innerHTML = '<div style="text-align: center; padding: 20px; color: red;">සෙවීමේ දෝෂයක් සිදුවිය</div>';
            });
        }
        
        function openUniversalResult(slug) {
            const category = slug.startsWith('slhis') ? 'slhis' : 
                           slug.startsWith('erphis') ? 'erphis' : 'indhis';
            document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.category-tab[data-category="${category}"]`).classList.add('active');
            state.currentCategory = category;
            sbClient.from('Historynt').select('*').like('slug', category + '%').order('slug', { ascending: true }).then(res => {
                if (res.error) throw res.error;
                state.currentLessons = res.data;
                const lessonIndex = state.currentLessons.findIndex(l => l.slug === slug);
                if (lessonIndex !== -1) {
                    displayLesson(lessonIndex);
                    document.getElementById('universalSearchBox').value = '';
                    document.getElementById('universalSearchResults').innerHTML = '';
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            }).catch(err => console.error('Error loading lesson:', err));
        }
    </script>
</body>
</html>
