<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>සටහන් පොත</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Sans Sinhala', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 1000px;
            margin: 0 auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        .nav-sidebar {
            position: fixed;
            left: -350px;
            top: 0;
            width: 350px;
            height: 100vh;
            background: white;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            transition: left 0.3s ease;
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }
        .nav-sidebar.open {
            left: 0;
        }
        .nav-sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #667eea;
        }
        .nav-sidebar-header h3 {
            color: #667eea;
            font-size: 1.3em;
            margin: 0;
        }
        .nav-close-btn {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: #667eea;
            padding: 5px 10px;
        }
        .nav-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 999;
        }
        .nav-overlay.active {
            display: block;
        }
        .nav-item {
            padding: 10px 15px;
            margin: 5px 0;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.2s;
            line-height: 1.5;
        }
        .nav-item:hover {
            background: #f0f0f0;
        }
        .nav-item.h1 {
            font-weight: bold;
            font-size: 1.1em;
            color: #667eea;
            margin-top: 15px;
            border-left: 4px solid #667eea;
        }
        .nav-item.h2 {
            padding-left: 25px;
            color: #555;
            font-size: 1em;
            border-left: 3px solid #ccc;
            margin-left: 10px;
        }
        .nav-item.h3 {
            padding-left: 40px;
            color: #777;
            font-size: 0.95em;
            border-left: 2px solid #ddd;
            margin-left: 20px;
        }
        .section-anchor {
            scroll-margin-top: 80px;
        }
        .category-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .category-tab {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Noto Sans Sinhala', sans-serif;
            background: #f0f0f0;
            color: #555;
        }
        .category-tab.slhis.active {
            background: #4285f4;
            color: white;
        }
        .category-tab.erphis.active {
            background: #ea4335;
            color: white;
        }
        .category-tab.indhis.active {
            background: #34a853;
            color: white;
        }
        .lesson-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            max-height: 300px;
            overflow-y: auto;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        .lesson-item {
            padding: 15px;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
            font-weight: 500;
        }
        .lesson-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .lesson-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .book-link {
            display: block;
            padding: 15px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .book-link:hover {
            transform: translateY(-2px);
        }
        .search-container {
            position: relative;
            margin-bottom: 20px;
        }
        #searchBox {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Noto Sans Sinhala', sans-serif;
        }
        .search-results-info {
            margin-top: 10px;
            text-align: center;
            color: #667eea;
            font-weight: bold;
        }
        .search-nav-buttons {
            display: none;
            gap: 10px;
            margin-top: 10px;
            justify-content: center;
        }
        .search-nav-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-size: 18px;
        }
        .page-indicator {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            font-weight: bold;
            color: white;
            display: none;
            font-size: 1.1em;
        }
        .note-area {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 100px;
            min-height: 400px;
            line-height: 1.8;
            font-size: 18px;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        .note-area h1, .note-area h2, .note-area h3 {
            color: #667eea;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        .note-area p {
            margin-bottom: 15px;
        }
        .loading {
            text-align: center;
            color: #667eea;
            padding: 40px;
            font-size: 1.2em;
        }
        .tooltip {
            position: fixed;
            background: rgba(0,0,0,0.95);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            display: none;
            z-index: 1001;
            max-width: 400px;
            font-size: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            line-height: 1.6;
        }
        .tooltip-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 1000;
        }
        .dictionary-word {
            color: #2196F3;
            font-weight: 600;
            cursor: help;
            border-bottom: 2px dotted #2196F3;
            transition: all 0.2s;
        }
        .dictionary-word:hover {
            background: rgba(33, 150, 243, 0.1);
            padding: 2px 4px;
            border-radius: 3px;
        }
        .button-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            background: linear-gradient(to top, rgba(255,255,255,0.98) 0%, rgba(255,255,255,0.95) 100%);
            padding: 15px 20px;

        .button-container button {

            border-radius: 10px;
            font-size: 18px;

            transition: all 0.3s;

        #navBtn {

        #prevLessonBtn, #nextLessonBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        #increaseBtn, #decreaseBtn {

        }
        .button-container button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        mark {
            background-color: yellow;
            padding: 2px 4px;
            border-radius: 2px;
        }
        @media (max-width: 768px) {
            .container { padding: 20px; }
            h1 { font-size: 1.8em; }
            .nav-sidebar { width: 280px; left: -280px; }
            .lesson-list { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
        }
    </style>
</head>

        <div class="search-container">

            <div class="search-results-info" id="searchInfo"></div>

            <button id="decreaseBtn" title="කුඩා කරන්න">-</button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        document.addEventListener('keydown', function(e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 73) || (e.ctrlKey && e.shiftKey && e.keyCode == 74) || (e.ctrlKey && e.keyCode == 85) || (e.ctrlKey && e.keyCode == 67) || (e.ctrlKey && e.keyCode == 65) || (e.ctrlKey && e.keyCode == 88) || (e.metaKey && e.keyCode == 67) || (e.metaKey && e.keyCode == 65) || (e.metaKey && e.keyCode == 88)) {
                e.preventDefault();
            }
        });
        document.addEventListener('copy', function(e) { e.preventDefault(); });
        document.addEventListener('cut', function(e) { e.preventDefault(); });

        var SUPABASE_URL = 'https://uqgzlaxsnknheoerbfus.supabase.co';
        var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVxZ3psYXhzbmtuaGVvZXJiZnVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5MjM2MTUsImV4cCI6MjA3OTI4MzYxNX0.IYWZ7ukx8J-GJMWy7cMk2BWnmzJmJjjE93yEmJie7nQ';
        var sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        var PEDIA_URL = 'https://uqgzlaxsnknheoerbfus.supabase.co';
        var PEDIA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVxZ3psYXhzbmtuaGVvZXJiZnVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5MjM2MTUsImV4cCI6MjA3OTI4MzYxNX0.IYWZ7ukx8J-GJMWy7cMk2BWnmzJmJjjE93yEmJie7nQ';
        var pediaClient = window.supabase.createClient(PEDIA_URL, PEDIA_KEY);
        var currentCategory = 'slhis';
        var currentLessons = [];
        var currentLessonIndex = 0;
        var fontSize = 18;
        var searchMatches = [];
        var currentSearchIndex = 0;
        var dictionaryWords = {};

        document.addEventListener('DOMContentLoaded', function() {
            setupEventListeners();
            loadDictionary().then(function() {
                loadLessons(currentCategory);
            });
        });

        function setupEventListeners() {
            document.querySelectorAll('.category-tab').forEach(function(tab) {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.category-tab').forEach(function(t) { t.classList.remove('active'); });
                    tab.classList.add('active');
                    currentCategory = tab.dataset.category;
                    loadLessons(currentCategory);
                });
            });
            document.getElementById('navBtn').addEventListener('click', toggleNavSidebar);
            document.getElementById('navCloseBtn').addEventListener('click', toggleNavSidebar);
            document.getElementById('navOverlay').addEventListener('click', toggleNavSidebar);
            document.getElementById('prevLessonBtn').addEventListener('click', function() { navigateLesson(-1); });
            document.getElementById('nextLessonBtn').addEventListener('click', function() { navigateLesson(1); });
            document.getElementById('increaseBtn').addEventListener('click', function() { changeFontSize(2); });
            document.getElementById('decreaseBtn').addEventListener('click', function() { changeFontSize(-2); });
            document.getElementById('searchBox').addEventListener('input', handleSearch);
            document.getElementById('prevSearchBtn').addEventListener('click', function() { navigateSearch(-1); });
            document.getElementById('nextSearchBtn').addEventListener('click', function() { navigateSearch(1); });
            document.getElementById('tooltipOverlay').addEventListener('click', hideTooltip);
        }

        function loadDictionary() {
            return pediaClient.from('learnX pedia').select('word, meaning').then(function(response) {
                if (response.error) throw response.error;
                response.data.forEach(function(item) {
                    var word = item.word.trim();
                    dictionaryWords[word] = item.meaning;
                });
                console.log('Dictionary loaded:', Object.keys(dictionaryWords).length, 'words');
            }).catch(function(error) {
                console.error('Error loading dictionary:', error);
            });
        }

        function loadLessons(category) {
            document.getElementById('noteArea').innerHTML = '<div class="loading">පාඩම් පූරණය වෙමින්...</div>';
            sbClient.from('Historynt').select('*').like('slug', category + '%').order('slug', { ascending: true }).then(function(response) {
                if (response.error) throw response.error;
                currentLessons = response.data;
                currentLessonIndex = 0;
                displayLessonList();
                if (currentLessons.length > 0) {
                    displayLesson(0);
                }
            }).catch(function(error) {
                console.error('Error loading lessons:', error);
                document.getElementById('noteArea').innerHTML = '<div class="loading">දත්ත පූරණය කිරීමේ දෝෂයක් සිදුවිය!</div>';
            });
        }

        function displayLessonList() {
            var lessonList = document.getElementById('lessonList');
            if (currentLessons.length === 0) {
                lessonList.innerHTML = '<div class="loading">පාඩම් නොමැත</div>';
                return;
            }
            lessonList.innerHTML = currentLessons.map(function(lesson, index) {
                return '<div class="lesson-item ' + (index === currentLessonIndex ? 'active' : '') + '" onclick="displayLesson(' + index + ')">' + lesson.title + '</div>';
            }).join('');
        }

        function displayLesson(index) {
            if (index < 0 || index >= currentLessons.length) return;
            currentLessonIndex = index;
            var lesson = currentLessons[index];
            document.getElementById('pageTitle').textContent = lesson.title;
            document.getElementById('pageIndicator').style.display = 'block';
            document.getElementById('pageIndicator').textContent = 'පාඩම ' + (index + 1) + ' / ' + currentLessons.length;
            var contentWithNav = addNavigationIds(lesson.content);
            var noteArea = document.getElementById('noteArea');
            noteArea.innerHTML = highlightDictionaryWords(contentWithNav);
            noteArea.style.fontSize = fontSize + 'px';
            setupDictionaryWordListeners();
            displayLessonList();
            generateNavigationMenu(lesson.content);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function addNavigationIds(content) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var headings = tempDiv.querySelectorAll('h1, h2, h3');
            headings.forEach(function(heading, i) {
                var id = 'section-' + i;
                heading.id = id;
                heading.classList.add('section-anchor');
            });
            return tempDiv.innerHTML;
        }

        function generateNavigationMenu(content) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var headings = tempDiv.querySelectorAll('h1, h2, h3');
            var navContent = document.getElementById('navContent');
            if (headings.length === 0) {
                navContent.innerHTML = '<div class="nav-empty-state"><p>මාතෘකා නොමැත</p></div>';
                return;
            }
            navContent.innerHTML = Array.from(headings).map(function(heading, i) {
                var id = 'section-' + i;
                return '<div class="nav-item ' + heading.tagName.toLowerCase() + '" onclick="scrollToSection(\'' + id + '\')">' + heading.textContent + '</div>';
            }).join('');
        }

        function highlightDictionaryWords(content) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var walker = document.createTreeWalker(tempDiv, NodeFilter.SHOW_TEXT, null, false);
            var textNodes = [];
            var node;
            while (node = walker.nextNode()) {
                textNodes.push(node);
            }
            
            var sortedWords = Object.keys(dictionaryWords).sort(function(a, b) { 
                return b.length - a.length; 
            });
            
            textNodes.forEach(function(textNode) {
                var originalText = textNode.textContent;
                var processedRanges = [];
                var replacements = [];
                
                sortedWords.forEach(function(word) {
                    var searchIndex = 0;
                    
                    while (searchIndex < originalText.length) {
                        var foundIndex = originalText.indexOf(word, searchIndex);
                        
                        if (foundIndex === -1) {
                            break;
                        }
                        
                        var charBefore = foundIndex > 0 ? originalText.charAt(foundIndex - 1) : ' ';
                        var charAfter = foundIndex + word.length < originalText.length ? originalText.charAt(foundIndex + word.length) : ' ';
                        var boundaries = ' .,!?;:\n\r\t';
                        
                        var isWordBoundary = (foundIndex === 0 || boundaries.indexOf(charBefore) !== -1) && 
                                             (foundIndex + word.length === originalText.length || boundaries.indexOf(charAfter) !== -1);
                        
                        if (isWordBoundary) {
                            var overlaps = false;
                            for (var i = 0; i < processedRanges.length; i++) {
                                var range = processedRanges[i];
                                if (!(foundIndex + word.length <= range.start || foundIndex >= range.end)) {
                                    overlaps = true;
                                    break;
                                }
                            }
                            
                            if (!overlaps) {
                                processedRanges.push({start: foundIndex, end: foundIndex + word.length});
                                replacements.push({
                                    index: foundIndex,
                                    length: word.length,
                                    word: word
                                });
                            }
                        }
                        
                        searchIndex = foundIndex + 1;
                    }
                });
                
                if (replacements.length > 0) {
                    replacements.sort(function(a, b) { return b.index - a.index; });
                    
                    var result = originalText;
                    replacements.forEach(function(replacement) {
                        var before = result.substring(0, replacement.index);
                        var middle = result.substring(replacement.index, replacement.index + replacement.length);
                        var after = result.substring(replacement.index + replacement.length);
                        result = before + '<span class="dictionary-word" data-word="' + replacement.word + '">' + middle + '</span>' + after;
                    });
                    
                    var span = document.createElement('span');
                    span.innerHTML = result;
                    textNode.replaceWith(span);
                }
            });
            
            return tempDiv.innerHTML;
        }

        function setupDictionaryWordListeners() {
            var dictionaryWordElements = document.querySelectorAll('.dictionary-word');
            dictionaryWordElements.forEach(function(element) {
                element.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var word = this.dataset.word;
                    var meaning = dictionaryWords[word];
                    if (meaning) {
                        showTooltip(e.clientX, e.clientY, word, meaning);
                    }
                });
            });
        }

        function showTooltip(x, y, word, meaning) {
            var tooltip = document.getElementById('tooltip');
            var overlay = document.getElementById('tooltipOverlay');
            tooltip.innerHTML = '<strong style="color: #2196F3; font-size: 18px;">' + word + '</strong><br><br>' + meaning;
            tooltip.style.display = 'block';
            overlay.style.display = 'block';
            var tooltipRect = tooltip.getBoundingClientRect();
            var left = x + 10;
            var top = y + 10;
            if (left + tooltipRect.width > window.innerWidth) {
                left = x - tooltipRect.width - 10;
            }
            if (top + tooltipRect.height > window.innerHeight) {
                top = y - tooltipRect.height - 10;
            }
            tooltip.style.left = left + 'px';
            tooltip.style.top = top + 'px';
        }

        function hideTooltip() {
            document.getElementById('tooltip').style.display = 'none';
            document.getElementById('tooltipOverlay').style.display = 'none';
        }

        function scrollToSection(id) {
            var element = document.getElementById(id);
            if (element) {
                element.scrollIntoView({ behavior: 'smooth', block: 'start' });
                toggleNavSidebar();
            }
        }

        function toggleNavSidebar() {
            var sidebar = document.getElementById('navSidebar');
            var overlay = document.getElementById('navOverlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        function navigateLesson(direction) {
            var newIndex = currentLessonIndex + direction;
            if (newIndex >= 0 && newIndex < currentLessons.length) {
                displayLesson(newIndex);
            }
        }

        function changeFontSize(change) {
            fontSize = Math.max(14, Math.min(28, fontSize + change));
            document.getElementById('noteArea').style.fontSize = fontSize + 'px';
        }

        function handleSearch() {
            var searchTerm = document.getElementById('searchBox').value.trim();
            var noteArea = document.getElementById('noteArea');
            noteArea.innerHTML = noteArea.innerHTML.replace(/<mark>/g, '').replace(/<\/mark>/g, '');
            searchMatches = [];
            currentSearchIndex = 0;
            if (!searchTerm) {
                document.getElementById('searchInfo').textContent = '';
                document.getElementById('searchNavButtons').style.display = 'none';
                return;
            }
            var content = noteArea.textContent;
            var regex = new RegExp(searchTerm, 'gi');
            var matches = content.match(regex);
            if (matches) {
                searchMatches = matches;
                var highlightedContent = noteArea.innerHTML.replace(new RegExp(searchTerm, 'gi'), function(match) {
                    return '<mark>' + match + '</mark>';
                });
                noteArea.innerHTML = highlightedContent;
                document.getElementById('searchInfo').textContent = matches.length + ' ප්‍රතිඵල හමුවිය';
                document.getElementById('searchNavButtons').style.display = 'flex';
                var firstMark = noteArea.querySelector('mark');
                if (firstMark) {
                    firstMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            } else {
                document.getElementById('searchInfo').textContent = 'ප්‍රතිඵල හමු නොවීය';
                document.getElementById('searchNavButtons').style.display = 'none';
            }
        }

        function navigateSearch(direction) {
            if (searchMatches.length === 0) return;
            currentSearchIndex += direction;
            if (currentSearchIndex < 0) currentSearchIndex = searchMatches.length - 1;
            if (currentSearchIndex >= searchMatches.length) currentSearchIndex = 0;
            var marks = document.querySelectorAll('mark');
            if (marks[currentSearchIndex]) {
                marks[currentSearchIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }
    </script>
</body>
</html>
